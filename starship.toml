"$schema" = 'https://starship.rs/config-schema.json'

palette = 'tokyonight-night'

format = """
[░▒▓](blue)\
$os\
[](bg:blue fg:blue)\
$directory\
[](fg:blue bg:blue0)\
$git_branch\
$git_status\
[](fg:blue0 bg:bg_highlight)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:bg_highlight bg:bg_dark)\
$time\
[ ](fg:bg_dark)\
\n$character"""

[directory]
style = "fg:bg bg:blue"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:blue0"
format = '[[ $symbol $branch ](fg:blue bg:blue0)]($style)'

[git_status]
style = "bg:blue0"
format = '[[($all_status$ahead_behind )](fg:blue bg:blue0)]($style)'

[nodejs]
symbol = ""
style = "bg:bg_highlight"
format = '[[ $symbol ($version) ](fg:blue bg:bg_highlight)]($style)'

[bun]
symbol = ""
style = "bg:bg_highlight"
format = '[[ $symbol ($version) ](fg:blue bg:bg_highlight)]($style)'

[rust]
symbol = ""
style = "bg:bg_highlight"
format = '[[ $symbol ($version) ](fg:blue bg:bg_highlight)]($style)'

[golang]
symbol = ""
style = "bg:bg_highlight"
format = '[[ $symbol ($version) ](fg:blue bg:bg_highlight)]($style)'

[php]
symbol = ""
style = "bg:bg_highlight"
format = '[[ $symbol ($version) ](fg:blue bg:bg_highlight)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:bg_dark"
format = '[[  $time ](fg:comment bg:bg_dark)]($style)'

[os]
style = "bg:blue fg:bg"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

