[com/github/libpinyin/ibus-libpinyin/libpinyin]
comma-period-page=false
correct-pinyin=false
dictionaries='5;6;15'
dynamic-adjust=true
emoji-candidate=false
english-candidate=false
english-input-mode=false
init-full=false
init-full-punct=true
init-simplified-chinese=true
lookup-table-page-size=7
lua-extension=false
main-switch='<Shift>'
minus-equal-page=true
network-dictionary-end-timestamp=int64 1692858705
network-dictionary-start-timestamp=int64 1600522231
punct-switch=''
sort-candidate-option=0
square-bracket-page=false
table-input-mode=false
trad-switch=''

[org/gnome/TextEditor]
restore-session=false

[org/gnome/desktop/input-sources]
current=uint32 0
mru-sources=[('xkb', 'us+colemak'), ('ibus', 'rime')]
sources=[('xkb', 'us+colemak'), ('ibus', 'rime')]
xkb-options=['caps:escape']

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
enable-hot-corners=false
toolkit-accessibility=false

[org/gnome/desktop/peripherals/touchpad]
disable-while-typing=true
edge-scrolling-enabled=false
speed=0.50427350427350426
two-finger-scrolling-enabled=true

[org/gnome/desktop/sound]
event-sounds=true
theme-name='__custom'

[org/gnome/desktop/wm/keybindings]
activate-window-menu=@as []
begin-move=@as []
begin-resize=@as []
close=['<Super>d']
cycle-group=@as []
cycle-group-backward=@as []
cycle-panels=@as []
cycle-panels-backward=@as []
cycle-windows=@as []
cycle-windows-backward=@as []
maximize=['<Super>Up']
minimize=@as []
move-to-monitor-down=@as []
move-to-monitor-left=@as []
move-to-monitor-right=@as []
move-to-monitor-up=@as []
move-to-workspace-1=@as []
move-to-workspace-last=@as []
move-to-workspace-left=@as []
move-to-workspace-right=@as []
panel-run-dialog=@as []
switch-group=@as []
switch-group-backward=@as []
switch-input-source=['<Super>space']
switch-input-source-backward=['<Shift><Super>space']
switch-panels=@as []
switch-panels-backward=@as []
switch-to-workspace-1=@as []
switch-to-workspace-last=@as []
switch-to-workspace-left=@as []
switch-to-workspace-right=@as []
toggle-maximized=@as []

[org/gnome/mutter]
workspaces-only-on-primary=true

[org/gnome/mutter/wayland/keybindings]
restore-shortcuts=@as []

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']
help=@as []
logout=@as []
magnifier=@as []
magnifier-zoom-in=@as []
magnifier-zoom-out=@as []
screenreader=@as []

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>Return'
command='wezterm-gui start --always-new-process'
name='wezterm'

[org/gnome/settings-daemon/plugins/power]
power-button-action='suspend'
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-type='suspend'

[org/gnome/shell/app-switcher]
current-workspace-only=true

[org/gnome/shell/keybindings]
focus-active-notification=@as []
screenshot=@as []
screenshot-window=@as []
show-screen-recording-ui=@as []
toggle-application-view=@as []
toggle-message-tray=@as []
toggle-quick-settings=@as []

[org/gnome/system/location]
enabled=false
